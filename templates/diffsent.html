<!doctype html>
<html>
  <head>
    <title>Diff {{book_id}} {{sent}}</title>
    <style>
      td { text-align: center; }
      div.sentence {
	        width: 100%;
	        overflow-x: scroll;
      }
      pre {
          width: 95%;
          overflow-x: scroll;
      }
      del {
          color: red;
      }
      ins {
          color: green;
      }
      li {
          display: inline-block;
          margin-right: 2em;
      }
    </style>
  </head>
  <body>
    <form action="accept" method="POST">
      <button type="submit">Accept</button>
    </form>
    <div class="sentence" data-sent="{{tree}}"></div>
    {% if feat_diff %}
    <table>
      <thead>
        <tr>
          <th>Word</th>
          <th>Features</th>
        </tr>
      </thead>
      <tbody>
        {% for idx, lemma, feats in feat_diff %}
        <tr>
          <td>{{idx}} {{lemma}}</td>
          <td>
            <ul>
              {% for feat, old, new in feats %}
              <li>{{feat}}: <ins>{{old}}</ins> <del>{{new}}</del></li>
              {% endfor %}
            </ul>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% endif %}
    <details>
      <summary>Final CG</summary>
      <pre>{{cg}}</pre>
    </details>
    <details>
      <summary>Initial CG</summary>
      <pre>{{raw}}</pre>
    </details>
    <details {% if rules %}open{% endif %}>
      <summary>Test Overrides</summary>
      <form method="POST">
        <textarea name="rules" cols="80" rows="5">{{rules}}</textarea>
        <button type="submit">Run</button>
      </form>
      <pre>
{{diff|safe}}
      </pre>
      <textarea>{{clean_rules}}</textarea>
    </details>
    <script type="text/javascript" src="/static/tree-diff.js"></script>
  </body>
</html>
